<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Quick Sniff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #f5ff00;
      --pink: #ff00cc;
      --cyan: #00ffee;
      --bg: #06000f;
      --text: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Press Start 2P', monospace;
    }

    body {
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.18) 3px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 200;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
      z-index: 199;
    }

    .bracket {
      position: fixed;
      width: 36px;
      height: 36px;
      pointer-events: none;
      z-index: 50;
    }
    .bracket-tl { top: 18px; left: 18px; border-top: 2px solid var(--pink); border-left: 2px solid var(--pink); }
    .bracket-tr { top: 18px; right: 18px; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
    .bracket-bl { bottom: 18px; left: 18px; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
    .bracket-br { bottom: 18px; right: 18px; border-bottom: 2px solid var(--pink); border-right: 2px solid var(--pink); }

    #canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0.9;
    }

    .content {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 100px;
      text-align: center;
    }

    .now-playing {
      font-size: 8px;
      letter-spacing: 5px;
      color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan);
      margin-bottom: 28px;
      animation: fadeUp 0.8s ease 0.1s both, flicker 6s 4s infinite;
    }

    .dj-tag {
      font-size: clamp(9px, 1.8vw, 13px);
      letter-spacing: 12px;
      color: var(--pink);
      text-shadow: 0 0 18px var(--pink);
      margin-bottom: 6px;
      animation: fadeUp 0.8s ease 0.25s both;
    }

    h1 {
      font-size: clamp(36px, 9vw, 80px);
      letter-spacing: 3px;
      line-height: 1.05;
      color: var(--yellow);
      text-shadow:
        0 0 18px var(--yellow),
        0 0 45px rgba(245,255,0,0.45),
        5px 5px 0 var(--pink);
      animation: fadeUp 0.8s ease 0.4s both, glitch 5s 2s infinite;
      margin: 0;
    }

    @keyframes glitch {
      0%, 88%, 100% {
        text-shadow: 0 0 18px var(--yellow), 0 0 45px rgba(245,255,0,0.45), 5px 5px 0 var(--pink);
        transform: translate(0);
      }
      89.5% { text-shadow: -4px 0 var(--cyan), 4px 0 var(--pink); transform: translate(-3px, 1px); }
      91%   { text-shadow: 4px 0 var(--cyan), -4px 0 var(--pink); transform: translate(3px, -1px); }
      92.5% {
        text-shadow: 0 0 18px var(--yellow), 0 0 45px rgba(245,255,0,0.45), 5px 5px 0 var(--pink);
        transform: translate(0);
      }
    }

    .divider {
      width: min(420px, 90vw);
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--pink) 20%, var(--yellow) 50%, var(--cyan) 80%, transparent);
      margin: 22px auto 18px;
      animation: fadeUp 0.8s ease 0.55s both;
    }

    .tagline {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(11px, 2vw, 15px);
      letter-spacing: 8px;
      color: var(--cyan);
      text-shadow: 0 0 10px var(--cyan);
      margin-bottom: 52px;
      animation: fadeUp 0.8s ease 0.65s both;
    }

    .watch-label {
      font-size: 7px;
      letter-spacing: 5px;
      color: var(--pink);
      text-shadow: 0 0 8px var(--pink);
      margin-bottom: 18px;
      animation: fadeUp 0.8s ease 0.8s both, flicker 4s 3s infinite;
    }

    .social-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: fadeUp 0.8s ease 0.95s both;
    }

    .yt-btn,
    .ig-btn {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      padding: 22px 48px;
      min-width: 240px;
      border: 2px solid var(--yellow);
      color: var(--yellow);
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      letter-spacing: 4px;
      overflow: hidden;
      transition: color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 0 18px rgba(245,255,0,0.25), inset 0 0 18px rgba(245,255,0,0.04);
      -webkit-tap-highlight-color: transparent;
    }

    .ig-btn {
      border-color: var(--pink);
      color: var(--pink);
      box-shadow: 0 0 18px rgba(255,0,204,0.25), inset 0 0 18px rgba(255,0,204,0.04);
    }

    .yt-btn::before,
    .ig-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.18s ease;
      z-index: 0;
    }

    .yt-btn:hover,
    .ig-btn:hover {
      color: #000;
      box-shadow: 0 0 50px rgba(245,255,0,0.75);
    }

    .ig-btn:hover {
      box-shadow: 0 0 50px rgba(255,0,204,0.75);
    }

    .yt-btn:hover::before,
    .ig-btn:hover::before {
      transform: scaleX(1);
    }

    .yt-btn:active,
    .ig-btn:active {
      transform: scale(0.96);
    }

    .yt-btn span,
    .ig-btn span {
      position: relative;
      z-index: 1;
    }

    .yt-icon {
      font-size: 30px;
      line-height: 1;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes flicker {
      0%, 96%, 100% { opacity: 1; }
      97% { opacity: 0.25; }
      98.5% { opacity: 1; }
      99.5% { opacity: 0.4; }
    }

    @media (max-width: 640px) {
      .social-links {
        width: 100%;
      }

      .yt-btn,
      .ig-btn {
        width: min(100%, 280px);
        min-width: 0;
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="bracket bracket-tl"></div>
  <div class="bracket bracket-tr"></div>
  <div class="bracket bracket-bl"></div>
  <div class="bracket bracket-br"></div>

  <canvas id="canvas"></canvas>

  <main class="content">
    <div class="now-playing">NOW PLAYING</div>
    <div class="dj-tag">DJ</div>
    <h1>QUICK SNIFF</h1>
    <div class="divider"></div>
    <div class="tagline">LIVE SETS • CLUB BANGERS • AFTER HOURS</div>
    <div class="watch-label">WATCH / FOLLOW</div>

    <div class="social-links">
      <a class="yt-btn" href="https://www.youtube.com/@quicksniff" target="_blank" rel="noopener noreferrer">
        <span class="yt-icon">▶</span>
        <span>YOUTUBE</span>
      </a>

      <a class="ig-btn" href="https://www.instagram.com/quick_sniff/" target="_blank" rel="noopener noreferrer">
        <span class="yt-icon">◎</span>
        <span>INSTAGRAM</span>
      </a>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
      createStars();
    }

    function createStars() {
      const count = Math.min(180, Math.max(80, Math.floor(window.innerWidth / 10)));
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 2 + 0.5,
        speed: Math.random() * 1.2 + 0.3
      }));
    }

    function drawStars() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (const star of stars) {
        star.y += star.speed;
        if (star.y > window.innerHeight) {
          star.y = 0;
          star.x = Math.random() * window.innerWidth;
        }
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawStars();
  </script>
</body>
</html>
